name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Check tag matches Cargo version
        run: |
          set -euo pipefail
          VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test

      - name: Build universal DMG
        run: MACAMP_UNIVERSAL=1 ./scripts/package_dmg.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          NOTES="$RUNNER_TEMP/release-notes.md"

          if ! gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" --jq .body > "$NOTES"; then
            echo "Release $TAG" > "$NOTES"
          fi
          if [[ ! -s "$NOTES" ]]; then
            echo "Release $TAG" > "$NOTES"
          fi
          echo >> "$NOTES"
          sed "s/{{VERSION}}/${VERSION}/g" .github/release-install.md >> "$NOTES"

          ASSETS=(dist/MacAmp-*.dmg dist/MacAmp-*.dmg.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
            gh release edit "$TAG" \
              --title "MacAmp $VERSION" \
              --notes-file "$NOTES"
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "MacAmp $VERSION" \
              --notes-file "$NOTES" \
              --verify-tag
          fi
