<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden;font-family:Arial,sans-serif}
.stage{position:absolute;inset:0;display:grid;place-items:center;background:transparent}
.icon{position:relative;width:880px;height:880px;border-radius:210px;background:
  radial-gradient(120% 100% at 30% 0%, #7a8573 0%, #4a5347 28%, #2a3028 70%, #151a15 100%);
  box-shadow: inset 0 10px 0 rgba(255,255,255,.22), inset 0 -12px 0 rgba(0,0,0,.55),
  0 38px 80px rgba(0,0,0,.55), 0 0 0 10px rgba(255,255,255,.06);
  overflow:hidden;
}
.icon::before{content:"";position:absolute;inset:0;border-radius:inherit;background:
  repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px);
  opacity:.6}
.icon::after{content:"";position:absolute;left:-15%;top:-55%;width:80%;height:120%;
  background:linear-gradient(180deg, rgba(255,255,255,.25), transparent);
  transform:rotate(22deg);filter:blur(10px);opacity:.55}
.player{position:absolute;left:96px;top:160px;width:688px;height:500px;border-radius:34px;
  background:linear-gradient(180deg,#5f6958,#333a32);border:6px solid #171c16;
  box-shadow: inset 4px 4px 0 #8e988a, inset -4px -4px 0 #0d110c, 0 24px 40px rgba(0,0,0,.45);
  padding:14px}
.titlebar{height:72px;border-radius:18px 18px 0 0;background:linear-gradient(180deg,#77816d,#343c32);
  border:4px solid #1a2019;box-shadow: inset 0 3px 0 rgba(255,255,255,.25);
  display:flex;align-items:center;gap:16px;padding:0 24px;box-sizing:border-box}
.logo{display:flex;align-items:flex-end;gap:5px;height:36px}
.logo i{display:block;width:7px;background:#ffbc5b;box-shadow:0 0 12px rgba(255,188,91,.5)}
.logo i:nth-child(1){height:12px;opacity:.6}.logo i:nth-child(2){height:25px;opacity:.8}
.logo i:nth-child(3){height:18px}.logo i:nth-child(4){height:34px;background:#a8f078;box-shadow:0 0 14px rgba(168,240,120,.65)}
.logo i:nth-child(5){height:15px;opacity:.7}
.title{font-weight:700;font-size:34px;letter-spacing:1px;color:#f0f4ec;text-shadow:0 2px 0 #1a2019}
.title small{font-size:20px;color:#a8f078;vertical-align:super;margin-left:8px}
.lights{margin-left:auto;display:flex;gap:8px}
.lights i{width:20px;height:20px;background:linear-gradient(180deg,#77816d,#333a32);border:3px solid #1a2019;box-shadow:inset 0 2px 0 rgba(255,255,255,.3)}
.screen{margin:14px 4px 0;height:300px;border-radius:8px;background:#07110a;border:6px solid #141913;
  box-shadow: inset 0 0 30px rgba(0,0,0,.9);display:flex;align-items:flex-end;justify-content:space-between;
  padding:24px 26px 22px;box-sizing:border-box;position:relative}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg, transparent 0 4px, rgba(0,0,0,.35) 4px 5px);pointer-events:none}
.bars{display:flex;align-items:flex-end;gap:10px;height:220px;width:330px}
.bars i{display:block;flex:1;background:linear-gradient(0deg,#a8f078 0 70%,#ffbc5b 70% 88%,#ff6f5e 88% 100%);
  box-shadow:0 0 16px rgba(168,240,120,.45);border-radius:2px}
.bars i:nth-child(1){height:80px}.bars i:nth-child(2){height:135px}.bars i:nth-child(3){height:180px}
.bars i:nth-child(4){height:150px}.bars i:nth-child(5){height:200px}.bars i:nth-child(6){height:120px}
.bars i:nth-child(7){height:95px}
.lcd{font-size:80px;line-height:1;margin-left:22px;color:#a8f078;text-shadow:0 0 24px rgba(168,240,120,.55),0 3px 0 #07110a;letter-spacing:4px;font-family:monospace}
.buttons{display:flex;gap:12px;margin-top:18px;padding:0 4px}
.buttons i{width:104px;height:58px;border-radius:4px;background:linear-gradient(180deg,#5f6958,#333a32);
  border:4px solid #1a2019;box-shadow:inset 0 3px 0 #8e988a, inset 0 -3px 0 #0d110c}
.buttons i:first-child{background:linear-gradient(180deg,#b6ff82,#5fa83c);box-shadow:0 0 26px rgba(168,240,120,.5),inset 0 3px 0 rgba(255,255,255,.35)}
</style></head><body><div class="stage"><div class="icon">
<div class="player">
 <div class="titlebar"><div class="logo"><i></i><i></i><i></i><i></i><i></i></div><div class="title">MACAMP<small>2.0</small></div><div class="lights"><i></i><i></i></div></div>
 <div class="screen"><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="lcd">2.0</div><div class="scan"></div></div>
 <div class="buttons"><i></i><i></i><i></i><i></i><i></i></div>
</div>
</div></div></body></html>
